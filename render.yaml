services:
  - type: web
    name: carte-prospection
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: NOTION_TOKEN
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: NOTION_DB_ID
        value: c70e0416a7d64dd990011f222bf5a4e7
